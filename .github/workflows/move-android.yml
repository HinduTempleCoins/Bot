name: Build MELEK Move (Android)

# Cloud build for the MELEK Move app — no local Android SDK needed. Produces:
#   • app-debug.apk        — sideload on a phone to TEST the step counter NOW (no Play account needed)
#   • app-release.aab      — the Google Play upload bundle
# And, ONCE the Play account + secrets exist, it SIGNS the AAB and AUTO-PUBLISHES it to the Play internal
# test track. All of that is gated on secrets, so before you add them the build behaves exactly as before
# (unsigned AAB artifact you can upload by hand). Add these repo secrets to turn the pipeline on:
#   MOVE_UPLOAD_KEYSTORE_BASE64       base64 of your upload keystore (keytool-generated; I can make it for you)
#   MOVE_UPLOAD_KEYSTORE_PASSWORD     keystore password
#   MOVE_UPLOAD_KEY_ALIAS             key alias
#   MOVE_UPLOAD_KEY_PASSWORD          key password
#   MOVE_PLAY_SERVICE_ACCOUNT_JSON    Play Console service-account JSON (Play → Setup → API access)
# Trigger: push to apps/move/** (or this file), or run manually (Actions → this workflow → Run).

on:
  push:
    paths:
      - 'apps/move/**'
      - '.github/workflows/move-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/move
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # Third-party action pinned to a commit SHA (a moving tag could be hijacked). Update deliberately.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3 (pinned 2026-06-22)

      # Detect whether the release secrets exist WITHOUT exposing them job-wide. Only this step (which never
      # prints the values, just their emptiness) and the specific signing/publish steps see the secrets.
      - name: Detect release secrets
        id: flags
        env:
          KS: ${{ secrets.MOVE_UPLOAD_KEYSTORE_BASE64 }}
          SA: ${{ secrets.MOVE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          has_ks=$([ -n "$KS" ] && echo true || echo false)
          has_sa=$([ -n "$SA" ] && echo true || echo false)
          echo "has_keystore=$has_ks" >> "$GITHUB_OUTPUT"
          echo "has_publish=$([ "$has_ks" = true ] && [ "$has_sa" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Capacitor deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply MELEK Move native patches (step service + permissions)
        run: bash native/apply.sh

      - name: Sync web assets + config
        run: npx cap sync android

      # Google Play requires new apps/updates to target API 35 (Android 15). Capacitor 6 defaults to 34,
      # so bump compile/target SDK to 35 — which needs Android Gradle Plugin >= 8.6 (using 8.7.2) and
      # Gradle >= 8.9. Done after `cap sync` so nothing overwrites it before the build.
      - name: Target Android 15 / API 35 (Play requirement) + matching AGP & Gradle
        working-directory: apps/move/android
        run: |
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' variables.gradle
          sed -i -E 's#com\.android\.tools\.build:gradle:[0-9.]+#com.android.tools.build:gradle:8.7.2#' build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.9-all.zip#' gradle/wrapper/gradle-wrapper.properties
          echo "SDK:"; grep -E "SdkVersion" variables.gradle
          echo "AGP:"; grep 'com.android.tools.build:gradle' build.gradle
          echo "Gradle:"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK (sideload to test) + release AAB (Play upload)
        working-directory: apps/move/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      # Sign the AAB with the upload key — only when the keystore secrets are configured. Uses the SAFE
      # env-var pattern (no untrusted input; secrets are read from $ENV, never interpolated into the shell).
      - name: Sign release AAB (if upload keystore is configured)
        if: ${{ steps.flags.outputs.has_keystore == 'true' }}
        working-directory: apps/move/android
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVE_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOVE_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVE_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVE_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload debug APK (install this on your phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: melek-move-debug-apk
          path: apps/move/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release AAB (Google Play upload bundle)
        uses: actions/upload-artifact@v4
        with:
          name: melek-move-release-aab
          path: apps/move/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      # Auto-publish to the Play INTERNAL test track — only when both the service account AND the upload key
      # are configured (a signed AAB is required). Until then this step is skipped and you upload by hand.
      - name: Publish to Google Play internal track (if service account is configured)
        if: ${{ steps.flags.outputs.has_publish == 'true' }}
        # Pinned to a commit SHA — this action RECEIVES the Play service-account JSON, so a hijacked tag must
        # not be able to silently start exfiltrating it. Update deliberately (Dependabot / manual review).
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1 (pinned 2026-06-22)
        with:
          serviceAccountJsonPlainText: ${{ secrets.MOVE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: community.soapbox.move
          releaseFiles: apps/move/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
