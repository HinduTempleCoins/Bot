<title>MELEK Offers Shell</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#fff; --ink:#0b0b0c; --dim:#6b6f76; --line:#e6e8eb;
    --gold:#d4a534; --cta:#111; --cta-ink:#ffd76a; --dot:#ff3b30; --radius:18px;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e0f11; --card:#17191d; --ink:#f2f3f5; --dim:#9aa0a8; --line:#24272c;
    --cta:#ffd76a; --cta-ink:#0b0b0c;
  }}
  :root[data-theme="dark"]{--bg:#0e0f11;--card:#17191d;--ink:#f2f3f5;--dim:#9aa0a8;--line:#24272c;--cta:#ffd76a;--cta-ink:#0b0b0c;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
  .wrap{max-width:520px;margin:0 auto}

  header{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:10px 0;border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;padding:0 16px}
  .bar h1{font-size:22px;font-weight:700;margin:0;flex:1;letter-spacing:-.4px}
  .ic{width:26px;height:26px;flex:0 0 auto;opacity:.75;cursor:pointer}
  /* swipeable category strip — the load-bearing pattern */
  nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 12px 0}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:none;border:0;color:var(--dim);font:inherit;padding:2px 12px 10px;
    display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-bottom:3px solid transparent}
  nav button .g{font-size:19px;line-height:1}
  nav button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

  main{padding:16px}
  .banner{background:linear-gradient(135deg,#1b1d22,#2a2d34);color:#fff;border-radius:var(--radius);
    padding:18px 44px 18px 18px;position:relative;margin-bottom:18px}
  .banner b{display:block;font-size:19px;margin-bottom:4px}
  .banner span{color:#c9ccd2;font-size:14px}
  .banner .x{position:absolute;top:12px;right:14px;color:#c9ccd2;cursor:pointer;font-size:17px}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
  .sec h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px}
  .all{background:var(--line);border:0;color:var(--ink);font:600 13px/1 inherit;padding:9px 15px;border-radius:999px;cursor:pointer}

  /* ONE card component — every vertical reuses it */
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
  .card .brand{font-weight:800;font-size:17px;letter-spacing:-.3px;margin-bottom:9px;display:flex;align-items:center;gap:9px}
  .card .brand .m{width:26px;height:26px;border-radius:8px;background:#000;display:grid;place-items:center;flex:0 0 auto}
  .card .brand .m i{width:11px;height:11px;border-radius:50%;border:2px solid var(--gold);display:block}
  .card h3{font-size:17px;font-weight:700;margin:0 0 8px;letter-spacing:-.2px}
  .card p{color:var(--dim);margin:0 0 14px}
  .card ul{color:var(--dim);margin:0 0 14px;padding-left:19px}
  .card li{margin:3px 0}
  .rows{border-top:1px solid var(--line);margin:0 0 14px;padding-top:12px}
  .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--dim)}
  .row b{color:var(--ink)}
  .det{display:inline-block;color:var(--ink);text-decoration:underline;font-size:14px;margin-bottom:14px;cursor:pointer}
  .cta{display:block;width:100%;background:var(--cta);color:var(--cta-ink);border:0;border-radius:999px;
    padding:15px;font:700 16px/1 inherit;cursor:pointer}

  /* full-screen comparison sheet */
  dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:100%;max-width:520px;height:100%;max-height:100%}
  dialog::backdrop{background:#000a}
  .sheet{padding:16px}
  .shead{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
  .shead .x{font-size:22px;cursor:pointer;background:none;border:0;color:var(--ink)}
  .shead h2{flex:1;text-align:center;font-size:20px;margin:0 30px 0 0;letter-spacing:-.3px}
  .disc{color:var(--dim);font-size:13px;text-align:center;margin:0 0 16px}

  footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:11px 0 max(11px,env(safe-area-inset-bottom))}
  footer div{position:relative;font-size:21px;opacity:.55;cursor:pointer}
  footer div[aria-current]{opacity:1}
  footer .b{position:absolute;top:-2px;right:-5px;width:8px;height:8px;background:var(--dot);border-radius:50%}
  /* the opportunity ledger — dollar + time per action */
  .led{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .led .top{display:flex;align-items:flex-start;gap:12px;padding:16px}
  .led .av{width:38px;height:38px;border-radius:12px;background:#000;display:grid;place-items:center;flex:0 0 auto;font-size:17px}
  .led .av i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--gold);display:block}
  .led .t{flex:1;font-weight:600;letter-spacing:-.1px}
  .led .amt{font-weight:800;font-size:19px;white-space:nowrap;letter-spacing:-.4px}
  .led .bot{border-top:1px solid var(--line);padding:12px 16px;color:var(--dim);font-size:14px;display:flex;justify-content:space-between}
  .hero{margin:2px 2px 18px}
  .hero h2{font-size:30px;line-height:1.12;letter-spacing:-1px;margin:0 0 16px;font-weight:800}
  .hero h2 em{font-style:normal}
  .hero .sm{font-size:17px;font-weight:600;color:var(--dim)}
  .split{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;gap:18px;align-items:center}
  .ring{width:104px;height:104px;flex:0 0 auto;border-radius:50%;
    background:conic-gradient(#14d6b0 0 57%,#6472d6 57% 91%,#8fb4f2 91% 98%,#cfd3d9 98% 100%);
    display:grid;place-items:center}
  .ring::after{content:'';width:62px;height:62px;border-radius:50%;background:var(--card)}
  .keys{flex:1;font-size:14px}
  .keys div{display:flex;align-items:center;gap:8px;padding:3px 0}
  .keys i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .keys span{flex:1;color:var(--dim)}
  .keys b{letter-spacing:-.2px}
  .conn{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);
    margin:-1px 0 18px;padding:15px 18px;font-weight:700}
  .conn a{display:block;color:var(--dim);font-weight:400;text-decoration:underline;margin-top:3px;cursor:pointer}
  .chip{display:inline-block;background:#d8f7ef;color:#08604e;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;margin-top:8px}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{background:#0d3b31;color:#7ceccf}}
  .bring{background:linear-gradient(135deg,#0f1a17,#13312a);color:#fff;border-radius:var(--radius);padding:18px;margin:6px 0 20px}
  .bring b{display:block;font-size:18px;margin-bottom:5px;letter-spacing:-.3px}
  .bring p{color:#a9d8c9;margin:0 0 14px;font-size:14px}
  .bring .steps{display:flex;gap:8px;text-align:center;font-size:12px;color:#a9d8c9}
  .bring .steps div{flex:1;background:#ffffff14;border-radius:12px;padding:10px 6px}
  .bring .steps b{font-size:19px;margin:0 0 3px;color:#fff}
  .bal{background:linear-gradient(140deg,#111,#2a2010);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .two{display:flex;gap:14px;text-align:center}
  .two > div{flex:1}
  .two .n{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.05}
  .two .gold .n{color:var(--gold)}
  .two .teal .n{color:#44e3bd}
  .two .u{font-size:11px;color:#c9bfa4;letter-spacing:1.6px;text-transform:uppercase;margin-top:6px}
  .two .w{font-size:12px;color:#9a937f;margin-top:5px}
  .bal .sub{color:#c9bfa4;font-size:13px;margin-top:14px;border-top:1px solid #ffffff1f;padding-top:12px;text-align:center}
  .pays{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
  .pays i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.6px;border-radius:5px;padding:3px 6px}
  .pays .m{background:#3a2e0e;color:var(--gold)}
  .pays .t{background:#0d3b31;color:#44e3bd}
  .earn{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
  .earn a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink)}
  .earn a b{display:block;font-size:15px;margin-bottom:2px}
  .earn a span{color:var(--dim);font-size:13px}
  .earn a em{display:block;font-style:normal;color:var(--gold);font-weight:800;margin-top:6px;font-size:15px}
  .mall{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .item .art{height:76px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#f0f1f4,#e2e4e9)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .item .art{background:linear-gradient(135deg,#22252a,#1a1d21)}}
  .item .b{padding:12px}
  .item .b b{display:block;font-size:14px;margin-bottom:3px}
  .item .b span{color:var(--dim);font-size:12px}
  .item .b em{display:block;font-style:normal;font-weight:800;color:var(--gold);margin-top:7px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:11px;display:flex;gap:14px;align-items:flex-start}
  .task .ico{width:40px;height:40px;border-radius:50%;background:#0f3b2e;color:#44e3bd;display:grid;place-items:center;flex:0 0 auto;font-size:18px}
  .task .bd{flex:1}
  .task .bd b{display:block;font-size:16px;margin-bottom:3px}
  .task .bd span{color:var(--dim);font-size:14px}
  .task .bd em{font-style:normal;display:inline-block;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.6px;border-radius:5px;padding:4px 7px}
  .task .free{background:#0d3b31;color:#44e3bd}
  .task .no{background:#3b1414;color:#ff8f8f}
  .task .heavy{background:#3a2e0e;color:var(--gold)}
  .opps{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
  .opps h3{font-size:20px;margin:0;letter-spacing:-.3px}
  .filt{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;cursor:pointer}
  .tot{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;text-align:center}
  .tot b{display:block;font-size:34px;letter-spacing:-1px;margin-bottom:2px}
  .tot span{color:var(--dim);font-size:14px}
  .note{color:var(--dim);font-size:13px;text-align:center;padding:18px 8px 4px}
</style>

<div class="wrap">
<header>
  <div class="bar">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    <h1 id="title">Products &amp; Offers</h1>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>

</header>

<main id="view"></main>

<dialog id="sheet"><div class="sheet">

  <div id="sheetBody"></div>
</div></dialog>

<p class="note">Design shell — structure only. Cards are the same component with different data.</p>
</div>

<footer>

</footer>

const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cardHTML(c){
  return `<article class="card">
    <div class="brand">${c.mark?'<span class="m"><i></i></span>':''}${esc(c.brand)}</div>
    ${c.h?`<h3>${esc(c.h)}</h3>`:''}
    ${c.p?`<p>${esc(c.p)}</p>`:''}
    ${c.list?`<ul>${c.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${c.det?`<span class="det">See details</span>`:''}
    ${c.rows?`<div class="rows">${c.rows.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`:''}
    <button class="cta">${esc(c.cta||'Continue')}</button>
  </article>`;
}

function ledgerHTML(r){
  return `<div class="led">
    <div class="top">
      <span class="av">${r.mark?'<i></i>':esc(r.icon||'●')}</span>
      <span class="t">${esc(r.t)}${r.chip?`<br><span class="chip">${esc(r.chip)}</span>`:''}</span>
      <span class="amt">${esc(r.amt)}</span>
    </div>
    <div class="bot"><span>⏱ Estimated time: ${esc(r.time)}</span><span>${esc(r.tag||'')} ⌄</span></div>
  </div>`;
}

function render(v){
  document.getElementById('title').textContent = v.title;
  const view = document.getElementById('view');
  view.innerHTML = '';
  if (v.banner) {
    const b = el(`<div class="banner"><span class="x">✕</span><b>${esc(v.banner.t)}</b><span>${esc(v.banner.s)}</span></div>`);
    b.querySelector('.x').onclick = () => b.remove();
    view.append(b);
  }
  if (v.tasks) {
    for (const t of v.tasks) view.append(el(`<div class="task">
      <span class="ico">${esc(t.i)}</span>
      <div class="bd"><b>${esc(t.t)}</b><span>${esc(t.d)}</span>
      ${t.tag?`<em class="${esc(t.cls)}">${esc(t.tag)}</em>`:''}</div></div>`));
  }
  if (v.rewards) {
    const r=v.rewards;
    view.append(el(`<div class="bal"><div class="two">
      <div class="gold"><div class="n">${esc(r.melek)}</div><div class="u">MELEK</div><div class="w">on chain · melek.salon</div></div>
      <div class="teal"><div class="n">${esc(r.bal)}</div><div class="u">${esc(r.unit)}</div><div class="w">in app · spend in the mall</div></div>
    </div><div class="sub">${esc(r.sub)}</div></div>`));
    view.append(el(`<div class="sec"><h2>Ways to earn</h2></div>`));
    view.append(el(`<div class="earn">${r.ways.map(w=>`<a><b>${esc(w.t)}</b><span>${esc(w.d)}</span><em>${esc(w.v)}</em>
      <span class="pays">${w.both?'<i class="m">MELEK</i>':''}<i class="t">${esc(r.unit.split(' ')[0])}</i></span></a>`).join('')}</div>`));
    const mh = el(`<div class="sec"><h2>Rewards mall</h2><button class="all">See All</button></div>`);
    view.append(mh);
    view.append(el(`<div class="mall">${r.mall.map(m=>`<div class="item"><div class="art">${esc(m.i)}</div>
      <div class="b"><b>${esc(m.t)}</b><span>${esc(m.d)}</span><em>${esc(m.p)}</em></div></div>`).join('')}</div>`));
  }
  if (v.ledger) {
    const free = v.ledger.filter(r=>r.free).reduce((a,r)=>a+(r.y||0),0);
    const paid = v.ledger.filter(r=>!r.free).reduce((a,r)=>a+(r.y||0),0);
    view.append(el(`<div class="hero"><h2>We found you an extra<br><em>$${(free+paid).toLocaleString('en-US',{minimumFractionDigits:2})}</em> <span class="sm">per year</span></h2></div>`));
    view.append(el(`<div class="split">
      <div class="ring"></div>
      <div class="keys">
        <div><i style="background:#14d6b0"></i><span>Free money you are owed</span><b>$${free.toFixed(0)}</b></div>
        <div><i style="background:#6472d6"></i><span>Earn more</span><b>$${paid.toFixed(0)}</b></div>
        <div><i style="background:#8fb4f2"></i><span>Save on bills</span><b>$0</b></div>
        <div><i style="background:#cfd3d9"></i><span>Other</span><b>$0</b></div>
      </div></div>`));
    view.append(el(`<div class="conn">Based on 0 connected accounts<a>Connect an account to sharpen these numbers</a></div>`));
    view.append(el(`<div class="bring">
      <b>Bring in money from anywhere.</b>
      <p>Each company on this list pays you itself — Fiverr, DoorDash, the survey panel, the hotel. Your money goes straight from them to you. It never passes through us. We keep the list wide and the free things first.</p>
      <div class="steps"><div><b>1</b>Pick one</div><div><b>2</b>Do it</div><div><b>3</b>They pay you</div></div>
    </div>`));
    const head = el(`<div class="opps"><h3>Your Opportunities</h3><span class="filt">⚙</span></div>`);
    view.append(head);
    for (const r of v.ledger) view.append(el(ledgerHTML(r)));
  }
  for (const s of v.sections) {
    const head = el(`<div class="sec"><h2>${esc(s.h)}</h2>${s.all?'<button class="all">See All</button>':''}</div>`);
    if (s.all) head.querySelector('.all').onclick = () => openSheet(v.title, s.cards);
    view.append(head);
    for (const c of s.cards) view.append(el(cardHTML(c)));
  }
}

function openSheet(title, cards){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = cards.concat(cards).map(cardHTML).join('');
  document.getElementById('sheet').showModal();
}

const tabs = document.getElementById('tabs');
VERTICALS.forEach((v,i)=>{
  const b = el(`<button role="tab" aria-selected="${i===0}"><span class="g">${v.g}</span>${esc(v.label)}</button>`);
  b.onclick = () => {
    [...tabs.children].forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    render(v); window.scrollTo({top:0});
  };
  tabs.append(b);
});
render(VERTICALS[0]);
</script>
