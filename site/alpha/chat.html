<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chat with Hathor — MELEK testnet</title>
<style>
  :root{--bg:#0b0e14;--card:#131826;--ink:#e8e6e3;--dim:#9aa4b2;--gold:#d4a23c;--line:#222a3a;--btn:#2c7be5;--me:#1c2435}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:1rem}
  .wrap{max-width:620px;width:100%;display:flex;flex-direction:column;height:calc(100vh - 2rem)}
  .head{display:flex;align-items:center;gap:.7rem;padding:.2rem .2rem .8rem}
  .avatar{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--gold),#7a5a18);flex:0 0 auto}
  .head h1{font-size:1.15rem;line-height:1.1}
  .head .sub{color:var(--dim);font-size:.78rem}
  .tag{display:inline-block;background:rgba(212,162,60,.12);color:var(--gold);border:1px solid rgba(212,162,60,.4);border-radius:999px;font-size:.66rem;font-weight:700;letter-spacing:.08em;padding:.12rem .55rem;margin-left:.4rem;vertical-align:middle}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden;min-height:0}
  #chat-list{flex:1 1 auto;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.85rem}
  .msg{display:flex;flex-direction:column;max-width:85%}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.hathor{align-self:flex-start;align-items:flex-start}
  .who{font-size:.68rem;color:var(--dim);margin:0 .3rem .15rem;letter-spacing:.03em}
  .bubble{padding:.6rem .85rem;border-radius:13px;white-space:pre-wrap;word-wrap:break-word}
  .msg.hathor .bubble{background:#0f1422;border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.me .bubble{background:var(--me);border:1px solid var(--line);border-bottom-right-radius:4px}
  .msg.hathor .who{color:var(--gold)}
  .typing .bubble{color:var(--dim);letter-spacing:.15em}
  #chat-form{display:flex;gap:.5rem;padding:.7rem;border-top:1px solid var(--line);background:#0f1422}
  #chat-input{flex:1 1 auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:.6rem .8rem}
  #chat-input:focus{outline:none;border-color:var(--gold)}
  #chat-send{background:var(--gold);color:#1a1304;border:0;border-radius:10px;padding:.6rem 1.1rem;font:inherit;font-weight:700;cursor:pointer}
  #chat-send:active{filter:brightness(.92)}
  .quick{display:flex;flex-wrap:wrap;gap:.4rem;padding:.2rem .2rem .6rem}
  .quick button{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--dim);font:inherit;font-size:.8rem;padding:.3rem .8rem;cursor:pointer}
  .quick button:hover{border-color:var(--gold);color:var(--ink)}
  .foot{color:var(--dim);font-size:.72rem;text-align:center;padding:.6rem .2rem 0}
  a{color:var(--btn)}
</style>
</head><body>
<div class="wrap">
  <div class="head">
    <div class="avatar" aria-hidden="true"></div>
    <div>
      <h1>Hathor <span class="tag">[TestNet not MELEK]</span></h1>
      <div class="sub">The MELEK witness — here to help you join</div>
    </div>
  </div>

  <div class="card">
    <div id="chat-list" role="log" aria-live="polite" aria-label="Conversation with Hathor"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Type a message…" aria-label="Your message" maxlength="500">
      <button id="chat-send" type="submit">Send</button>
    </form>
  </div>

  <div class="quick" aria-label="Quick prompts">
    <button type="button" data-say="how do i sign up">How do I sign up?</button>
    <button type="button" data-say="what is a key">What is a key?</button>
    <button type="button" data-say="is this free">Is this free?</button>
    <button type="button" data-say="i have no idea what i'm doing">I have no idea what I'm doing 🤷</button>
    <button type="button" data-say="!help">!help</button>
  </div>

  <p class="foot">Hathor never asks for your password or private keys — your keys are made in your browser and stay with you.
  Ready to create one? <a href="/account/signup.html">Open the signup page</a>.</p>
</div>

<script type="module">
  import { mount } from './chat.mjs';
  const api = mount();
  // Wire the quick-prompt chips to the same submit path.
  for (const b of document.querySelectorAll('.quick button')) {
    b.addEventListener('click', () => api && api.submit(b.getAttribute('data-say')));
  }
</script>
</body></html>
