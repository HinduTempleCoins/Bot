<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Holy basil (tulsi)"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">CULINARY HERB</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Holy basil (tulsi)</text><text x="500" y="274" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Ocimum tenuiflorum L. (syn. O. sanctum) · leaf, aerial parts</text><line x1="430" y1="310" x2="570" y2="310" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="350" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="350" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="392" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">methyleugenol</text><rect x="420" y="379" width="430" height="18" rx="3" fill="#4e9a4e" opacity="0.92"/><text x="930" y="393" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">up to 40-70 in some accessions</text><text x="70" y="422" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">eugenol</text><rect x="420" y="409" width="410.45" height="18" rx="3" fill="#4e9a4e" opacity="0.92"/><text x="930" y="423" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">30-75</text><text x="70" y="452" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-caryophyllene</text><rect x="420" y="439" width="117.27" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="453" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">5-25</text><text x="70" y="482" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-elemene</text><rect x="420" y="469" width="54.73" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="483" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">2-12</text><text x="70" y="512" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">germacrene D</text><rect x="420" y="499" width="43" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="513" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">1-10</text><text x="70" y="638" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="666" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Holy basil is eugenol-led, so it behaves in the pan more like clove than like sweet</text><text x="70" y="689" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">basil: eugenol is less volatile and more heat-stable than linalool, which is exactly why</text><text x="70" y="712" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Thai cooking throws holy basil into a hot wok while Italian cooking keeps sweet basil</text><text x="70" y="735" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">off the heat. Eugenol&#39;s phenolic character also makes it antimicrobial and gives the</text><text x="70" y="758" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">astringent, slightly numbing finish.</text><text x="70" y="891" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">ENZYMES IT TOUCHES</text><text x="70" y="919" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">CYP3A4 / CYP2C9</text><text x="86" y="942" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · in vitro</text><text x="70" y="968" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#b4793a">CYP1A1/1A2</text><text x="210" y="968" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#9b9382">mixed · animal</text><text x="70" y="995" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#4f8fd4">phase II (GST, quinone reductase)</text><text x="86" y="1018" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">induce · animal</text><text x="70" y="1052" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="14" font-weight="400" fill="#9b9382">Inhibiting an enzyme raises the level of every drug it clears. Inducing one lowers it.</text><text x="70" y="1182" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="1210" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Leaf and tea are well tolerated in traditional use. The oil carries methyleugenol, a</text><text x="70" y="1233" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">rodent genotoxic carcinogen restricted in the EU. Pregnancy: Traditional texts are</text><text x="70" y="1256" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">divided; some animal data suggest antifertility and uterine effects.</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>