<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Wormwood (grand wormwood)"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">BEVERAGE</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Wormwood (grand</text><text x="500" y="270" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">wormwood)</text><text x="500" y="342" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Artemisia absinthium L. · herb (leaf, flowering top)</text><line x1="430" y1="378" x2="570" y2="378" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="418" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="418" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="460" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-thujone</text><rect x="420" y="447" width="430" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="461" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">18-60</text><text x="70" y="490" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">sabinyl acetate</text><rect x="420" y="477" width="110.26" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="491" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">0-20</text><text x="70" y="520" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">alpha-thujone</text><rect x="420" y="507" width="55.13" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="521" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">0-10</text><text x="70" y="550" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">chamazulene</text><rect x="420" y="537" width="27.56" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="551" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">0-5</text><text x="70" y="676" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="704" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Bitter sesquiterpene lactones stimulate TAS2R receptors and reflex digestive secretion;</text><text x="70" y="727" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">used in aperitifs where bitterness is the point. Thujone levels in historic and modern</text><text x="70" y="750" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">absinthe are low (Lachenmeier 2008 found pre-ban samples mostly &lt;~35 mg/L); absinthe</text><text x="70" y="773" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">effects were mainly ethanol.</text><text x="70" y="906" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">ENZYMES IT TOUCHES</text><text x="70" y="934" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#b4793a">GABA-A</text><text x="210" y="934" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#9b9382">mixed · in vitro</text><text x="70" y="961" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">5-HT3 receptor</text><text x="86" y="984" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · in vitro</text><text x="70" y="1010" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#4f8fd4">bitter taste receptors (TAS2R)</text><text x="86" y="1033" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">induce (agonist) · in vitro</text><text x="70" y="1067" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="14" font-weight="400" fill="#9b9382">Inhibiting an enzyme raises the level of every drug it clears. Inducing one lowers it.</text><text x="70" y="1197" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="1225" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Thujone convulsant; oil ingestion caused seizures, rhabdomyolysis and acute renal</text><text x="70" y="1248" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">failure (Weisbord 1997 NEJM, 10 ml oil). Pregnancy: Contraindicated (emmenagogue,</text><text x="70" y="1271" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">thujone)</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>