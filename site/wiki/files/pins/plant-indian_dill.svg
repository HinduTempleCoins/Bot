<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Indian dill (sowa)"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">CULINARY SPICE</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Indian dill (sowa)</text><text x="500" y="274" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Anethum sowa Roxb. ex Fleming (often treated as A. graveolens</text><text x="500" y="300" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">var. sowa) · fruit (seed)</text><line x1="430" y1="336" x2="570" y2="336" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="376" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="376" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="418" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">dillapiole</text><rect x="420" y="405" width="430" height="18" rx="3" fill="#4e9a4e" opacity="0.92"/><text x="930" y="419" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">20-60</text><text x="70" y="448" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">(R)-(+)-carvone</text><rect x="420" y="435" width="268.75" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="449" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">10-40</text><text x="70" y="478" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">limonene</text><rect x="420" y="465" width="215" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="479" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">10-30</text><text x="70" y="508" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">dihydrocarvone</text><rect x="420" y="495" width="48.38" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="509" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">1-8</text><text x="70" y="634" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="662" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Used as both herb and seed spice in Indian cooking for its carminative reputation in</text><text x="70" y="685" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">pulse dishes — pulses produce gas through oligosaccharide fermentation, and carvone-rich</text><text x="70" y="708" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">carminatives are the traditional counter. The dillapiole fraction adds a heavier, more</text><text x="70" y="731" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">resinous aroma than European dill, which is why Indian dill does not taste like</text><text x="70" y="754" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Scandinavian dill despite the same common name.</text><text x="70" y="887" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">ENZYMES IT TOUCHES</text><text x="70" y="915" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">CYP1A2 and other P450s</text><text x="86" y="938" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · in vitro</text><text x="70" y="972" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="14" font-weight="400" fill="#9b9382">Inhibiting an enzyme raises the level of every drug it clears. Inducing one lowers it.</text><text x="70" y="1102" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="1130" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Dillapiole shares the methylenedioxyphenyl motif with safrole and myristicin;</text><text x="70" y="1153" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">concentrated oil should not be treated as interchangeable with culinary dill oil.</text><text x="70" y="1176" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Hepatic concern is mechanistic rather than demonstrated for dillapiole specifically.</text><text x="70" y="1199" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Pregnancy: Avoid medicinal doses and the concentrated oil; traditional emmenagogue use.</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>