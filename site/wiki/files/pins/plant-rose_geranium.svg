<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Rose geranium"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">AROMATHERAPY</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Rose geranium</text><text x="500" y="274" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Pelargonium graveolens L&#39;Hér. (and P. × asperum, P. capitatum</text><text x="500" y="300" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">hybrids &#39;Rosé&#39;) · leaf and stem (steam-distilled); fresh</text><text x="500" y="326" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">leaves culinary</text><line x1="430" y1="362" x2="570" y2="362" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="402" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="402" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="444" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">citronellol</text><rect x="420" y="431" width="430" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="445" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">35-45</text><text x="70" y="474" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">geraniol</text><rect x="420" y="461" width="166.63" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="475" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">13-18</text><text x="70" y="504" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">linalool</text><rect x="420" y="491" width="107.5" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="505" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">~10</text><text x="70" y="534" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">citronellyl formate</text><rect x="420" y="521" width="96.75" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="535" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">8-10</text><text x="70" y="564" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">isomenthone</text><rect x="420" y="551" width="64.5" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="565" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">5-7</text><text x="70" y="594" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">10-epi-γ-eudesmol</text><rect x="420" y="581" width="53.75" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="595" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">4-6 (marker)</text><text x="70" y="720" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="748" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Leaf oil gives an inexpensive rose note; steeped in cream or sugar, terpene alcohols</text><text x="70" y="771" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">transfer to fat; leaves line cake tins to perfume batter by contact.</text><text x="70" y="904" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="932" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Low. Pregnancy: Culinary/topical diluted acceptable.</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>