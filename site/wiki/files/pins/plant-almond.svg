<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Almond (sweet and bitter)"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">CULINARY NUT</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Almond (sweet and</text><text x="500" y="270" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">bitter)</text><text x="500" y="342" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Prunus dulcis (Mill.) D.A.Webb — var. dulcis (sweet) and var.</text><text x="500" y="368" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">amara (bitter) · seed (kernel)</text><line x1="430" y1="404" x2="570" y2="404" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="444" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="444" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="486" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">benzaldehyde</text><rect x="420" y="473" width="430" height="18" rx="3" fill="#b4793a" opacity="0.92"/><text x="930" y="487" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">95-98</text><text x="70" y="516" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">hydrogen cyanide</text><rect x="420" y="503" width="13.37" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="517" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">2-4 in the crude oil; removed in the FFPA grade</text><text x="70" y="546" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">benzyl alcohol, benzoic acid</text><rect x="420" y="533" width="2" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="547" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">trace</text><text x="70" y="656.75" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="684.75" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Almond is two ingredients. Sweet almond is a fat-and-protein ingredient: 45-60% oil,</text><text x="70" y="707.75" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">which is why ground almonds enrich and tenderise baked goods by interfering with gluten,</text><text x="70" y="730.75" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">why almond milk is an emulsion rather than a solution, and why marzipan holds together</text><text x="70" y="753.75" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">on sugar and almond oil alone.</text><text x="70" y="871.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">ENZYMES IT TOUCHES</text><text x="70" y="899.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#b4793a">beta-glucosidase / amygdalin hydrolase / mandelonitrile lyase (the plant&#39;s own enzymes)</text><text x="86" y="922.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">substrate · in vitro</text><text x="70" y="948.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#b4793a">gut bacterial beta-glucosidases</text><text x="86" y="971.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">substrate · human PK</text><text x="70" y="997.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#b4793a">rhodanese (thiosulfate sulfurtransferase)</text><text x="86" y="1020.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">detoxification pathway · human PK</text><text x="70" y="1046.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">cytochrome c oxidase</text><text x="86" y="1069.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · human PK</text><text x="70" y="1103.5" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="14" font-weight="400" fill="#9b9382">Inhibiting an enzyme raises the level of every drug it clears. Inducing one lowers it.</text><text x="70" y="1218.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="1246.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Bitter almonds and other Rosaceae kernels are a genuine cyanide hazard, and children are</text><text x="70" y="1269.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">the highest-risk group because the dose scales with body weight. EFSA&#39;s 2016 CONTAM</text><text x="70" y="1292.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">opinion on cyanogenic glycosides in apricot kernels set an acute reference dose of 20</text><text x="70" y="1315.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">micrograms of cyanide per kg body weight, derived from a 0.105 mg/kg bw exposure with</text><text x="70" y="1338.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">uncertainty factors of 1.5 (toxicokinetic) and 3.16 (toxicodynamic); EFSA notes this</text><text x="70" y="1361.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">ARfD is 25 times below the lowest reported lethal dose of 0.5-3.5 mg/kg bw. Pregnancy:</text><text x="70" y="1384.25" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Sweet almond is food.</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>