<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Lemon"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">CITRUS</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Lemon</text><text x="500" y="274" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Citrus limon (L.) Osbeck · peel (flakedo/zest), juice, leaf</text><line x1="430" y1="310" x2="570" y2="310" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="350" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="350" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="392" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">limonene</text><rect x="420" y="379" width="430" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="393" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">56-76</text><text x="70" y="422" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-pinene</text><rect x="420" y="409" width="74.92" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="423" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">6-17</text><text x="70" y="452" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">gamma-terpinene</text><rect x="420" y="439" width="52.12" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="453" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">3-13</text><text x="70" y="482" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">citral (geranial+neral)</text><rect x="420" y="469" width="19.55" height="18" rx="3" fill="#b4793a" opacity="0.92"/><text x="930" y="483" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">1-5</text><text x="70" y="512" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">alpha-pinene</text><rect x="420" y="499" width="16.29" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="513" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">1-4</text><text x="70" y="542" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">sabinene</text><rect x="420" y="529" width="13.03" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="543" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">1-3</text><text x="70" y="668" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="696" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">The zest holds the oil and the juice holds the acid, which is why recipes call for both</text><text x="70" y="719" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">separately: the oil is fat-soluble and goes into butter, dough or dressing; the acid is</text><text x="70" y="742" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">water-soluble and used for brightness, pH and protein denaturation (ceviche, curd set).</text><text x="70" y="765" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Acid also inhibits polyphenol oxidase, which is why lemon juice stops cut apples</text><text x="70" y="788" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">browning.</text><text x="70" y="921" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">ENZYMES IT TOUCHES</text><text x="70" y="949" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">CYP3A4 (intestinal)</text><text x="86" y="972" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit (weak compared with grapefruit) · human PK</text><text x="70" y="998" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">CYP1B1 / CYP1A2</text><text x="86" y="1021" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · in vitro</text><text x="70" y="1055" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="14" font-weight="400" fill="#9b9382">Inhibiting an enzyme raises the level of every drug it clears. Inducing one lowers it.</text><text x="70" y="1185" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="1213" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Low. Peel oil is a mucosal irritant neat. Pregnancy: Culinary and inhaled use fine.</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>