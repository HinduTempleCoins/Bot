<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Curry leaf"><rect width="1000" height="1500" fill="#171410"/><rect x="26" y="26" width="948" height="1448" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity="0.5"/><text x="500" y="150" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="600" fill="#c8a24a" letter-spacing="5">CULINARY HERB</text><text x="500" y="202" text-anchor="middle" font-family="Georgia,"Iowan Old Style","Times New Roman",serif" font-size="60" font-weight="700" fill="#efe7d7">Curry leaf</text><text x="500" y="274" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">Murraya koenigii (L.) Spreng. (syn. Bergera koenigii) · fresh</text><text x="500" y="300" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="19" font-weight="400" fill="#9b9382">leaf</text><line x1="430" y1="336" x2="570" y2="336" stroke="#c8a24a" stroke-width="1.4" opacity="0.8"/><text x="70" y="376" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHAT IS IN THE OIL</text><text x="930" y="376" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="13" font-weight="400" fill="#9b9382">% of the essential oil</text><text x="70" y="418" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">alpha-pinene</text><rect x="420" y="405" width="430" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="419" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">40-55</text><text x="70" y="448" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-caryophyllene</text><rect x="420" y="435" width="181.05" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="449" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">10-30</text><text x="70" y="478" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">sabinene</text><rect x="420" y="465" width="181.05" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="479" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">5-35</text><text x="70" y="508" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-pinene</text><rect x="420" y="495" width="90.53" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="509" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">5-15</text><text x="70" y="538" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">beta-phellandrene</text><rect x="420" y="525" width="76.95" height="18" rx="3" fill="#8d8574" opacity="0.92"/><text x="930" y="539" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">2-15</text><text x="70" y="568" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#efe7d7">linalool</text><rect x="420" y="555" width="49.79" height="18" rx="3" fill="#4f8fd4" opacity="0.92"/><text x="930" y="569" text-anchor="end" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">1-10</text><text x="70" y="694" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">WHY A KITCHEN USES IT</text><text x="70" y="722" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Leaves are fried in hot oil/ghee with mustard seed in the tadka; frying releases</text><text x="70" y="745" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">terpenes into fat and Maillard-crisps the leaf. The fat then carries flavour through the</text><text x="70" y="768" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">dish.</text><text x="70" y="901" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">ENZYMES IT TOUCHES</text><text x="70" y="929" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">CYP3A4 / CYP2C9 / CYP2D6</text><text x="86" y="952" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · in vitro</text><text x="70" y="978" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="18" font-weight="700" fill="#cf5347">alpha-glucosidase / alpha-amylase</text><text x="86" y="1001" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="15" font-weight="400" fill="#9b9382">inhibit · in vitro</text><text x="70" y="1035" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="14" font-weight="400" fill="#9b9382">Inhibiting an enzyme raises the level of every drug it clears. Inducing one lowers it.</text><text x="70" y="1165" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="600" fill="#c8a24a" letter-spacing="3">CAUTION</text><text x="70" y="1193" text-anchor="start" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="16" font-weight="400" fill="#efe7d7">Low. Seeds reported toxic in some folk sources (unverified). Pregnancy: Culinary fine.</text><text x="500" y="1448" text-anchor="middle" font-family="system-ui,-apple-system,"Segoe UI",sans-serif" font-size="17" font-weight="400" fill="#c8a24a" letter-spacing="2">wiki.soapbox.community</text></svg>