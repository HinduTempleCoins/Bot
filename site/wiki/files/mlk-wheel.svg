ew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c8a24a" direction="rtl" unicode-bidi="bidi-override">מָלַךְ</text><text x="817.5" y="237.92" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">mālak</text><text x="817.5" y="257.92" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">to reign, to be king</text><text x="962.08" y="360.5" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c8a24a" direction="rtl" unicode-bidi="bidi-override">מַלְכָּה</text><text x="962.08" y="382.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">malkâ</text><text x="962.08" y="402.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">queen</text><text x="1015" y="558" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c8a24a" direction="rtl" unicode-bidi="bidi-override">מַלְכוּת</text><text x="1015" y="580" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">malkût</text><text x="1015" y="600" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">kingdom, kingship</text><text x="962.08" y="755.5" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c8a24a" direction="rtl" unicode-bidi="bidi-override">מֹלֶךְ</text><text x="962.08" y="777.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">mōlek</text><text x="962.08" y="797.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">Molech — read by some as an</text><text x="962.08" y="813.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">offering, not a name</text><text x="817.5" y="900.08" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c8a24a" direction="rtl" unicode-bidi="bidi-override">מִלְכֹּם</text><text x="817.5" y="922.08" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">Milkōm</text><text x="817.5" y="942.08" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">Milcom, the Ammonite god</text><text x="620" y="953" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c8a24a" direction="rtl" unicode-bidi="bidi-override">מַלְכִּי־צֶדֶק</text><text x="620" y="975" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">Malkî-ṣedeq</text><text x="620" y="995" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">Melchizedek — &quot;my king is</text><text x="620" y="1011" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">righteousness&quot;</text><text x="422.5" y="900.08" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c0553f" direction="rtl" unicode-bidi="bidi-override">מלקרת</text><text x="422.5" y="922.08" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">Melqart</text><text x="422.5" y="942.08" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">Melqart — mlk-qrt, &quot;King of</text><text x="422.5" y="958.08" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">the City&quot; · Punic, unpointed</text><text x="277.92" y="755.5" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#c0553f" direction="rtl" unicode-bidi="bidi-override">מלך</text><text x="277.92" y="777.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">molk</text><text x="277.92" y="797.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">the offering named on the</text><text x="277.92" y="813.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">Punic tophet stones ·</text><text x="277.92" y="829.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">unpointed</text><text x="225" y="558" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#5b8fd4" direction="rtl" unicode-bidi="bidi-override">מַלְאָךְ</text><text x="225" y="580" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">mal&#39;āk</text><text x="225" y="600" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">messenger, angel — from l-ʾ-k,</text><text x="225" y="616" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">&quot;to send&quot;</text><text x="277.92" y="360.5" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#5b8fd4" direction="rtl" unicode-bidi="bidi-override">מַלְאָכִי</text><text x="277.92" y="382.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">Mal&#39;ākî</text><text x="277.92" y="402.5" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">Malachi — &quot;my messenger&quot;</text><text x="422.5" y="215.92" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="30" font-weight="700" fill="#5b8fd4" direction="rtl" unicode-bidi="bidi-override">מְלָאכָה</text><text x="422.5" y="237.92" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14.5" font-weight="600" fill="#f0e9db">mᵊlā&#39;kâ</text><text x="422.5" y="257.92" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">work, craft — also from l-ʾ-k</text><circle cx="620" cy="570" r="92" fill="#141210" stroke="#c8a24a" stroke-width="2"/><text x="620" y="586" text-anchor="middle" font-family="&#39;Noto Sans Hebrew&#39;,&#39;Noto Serif Hebrew&#39;,&#39;SBL Hebrew&#39;,&#39;Times New Roman&#39;,&#39;DejaVu Sans&#39;,&#39;FreeSerif&#39;,serif" font-size="70" font-weight="700" fill="#f0e9db" direction="rtl" unicode-bidi="bidi-override">מלך</text><text x="620" y="618" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="14" font-weight="400" fill="#c8a24a" letter-spacing="3">m · l · k</text><text x="620" y="452" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="12.5" font-weight="400" fill="#968d7c">three letters, no vowels</text><circle cx="70" cy="974" r="6" fill="#c8a24a"/><text x="86" y="978" text-anchor="start" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="13" font-weight="400" fill="#f0e9db">written מלך — the same three letters</text><circle cx="70" cy="996" r="6" fill="#c0553f"/><text x="86" y="1000" text-anchor="start" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="13" font-weight="400" fill="#f0e9db">Punic: Melqart, and the offering on the tophet stones</text><circle cx="70" cy="1018" r="6" fill="#5b8fd4"/><text x="86" y="1022" text-anchor="start" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="13" font-weight="400" fill="#f0e9db">written with an aleph — the messenger words, the same field of sense</text><text x="620" y="1084" text-anchor="middle" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,sans-serif" font-size="13" font-weight="400" fill="#968d7c">The Masoretes chose from this field, and passed their choice on. The readings not taken were live, not wrong.</text></svg>